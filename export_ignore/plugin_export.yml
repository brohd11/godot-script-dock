export_root: "res://addons/script_dock/export_ignore/exports"
exports:
  -
    exclude:
      directories:
        - "res://addons/script_dock/export_ignore"
      file_extensions: []
      files: []
    export_folder: "script-dock{{version=script_dock}}/script_dock"
    other_transfers: []
    parser_overide_settings:
      parse_cs: {}
      parse_gd: {}
      parse_tres: {}
      parse_tscn: {}
    remote_dir: "res://addons/script_dock/src/remote"
    source: "res://addons/script_dock"
options:
  include_import: true
  include_uid: true
  overwrite: true
  parser_settings:
    backport_target: 100.0
    parse_cs:
      namespace_rename: {}
    parse_gd:
      backport_string_renames: {}
      class_rename_ignore: []
      replace_editor_interface: false
    parse_tres: {}
    parse_tscn: {}
    use_relative_paths: false
plugin_folder: "ScriptDock{{version=script_dock}}"
post_script: "res://addons/script_dock/export_ignore/pre_post_export.gd"
pre_script: "res://addons/script_dock/export_ignore/pre_post_export.gd"
